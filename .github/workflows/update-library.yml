# Rebuilds the library page whenever something is pushed to main — including a PDF uploaded
# through github.com — so nobody has to run the build on their own computer.
# It regenerates index.html, covers/ and data/library.json, commits them if they changed,
# then asks GitHub Pages to publish. See docs/decisions/0004-simplify.md.
name: Update library

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # commit the regenerated files
  pages: write # request a Pages build (pushes made with GITHUB_TOKEN don't trigger one)

# One run at a time, in order, so two quick uploads can't race each other's commit.
concurrency:
  group: update-library
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The tip of main, not the triggering commit: an earlier run may have committed since.
          ref: main

      - name: Install poppler (page counts and covers)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils

      - name: Build
        run: node tools/build.mjs

      - name: Commit changes
        id: commit
        run: |
          git add -A index.html covers data
          if git diff --cached --quiet; then
            echo "Library already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update library index"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
